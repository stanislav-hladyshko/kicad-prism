[workspace]
members = [
    "src/rs/prism-kicad-codegen",
    "src/rs/prism-kicad-contracts",
    "src/rs/prism-kicad-core",
    "src/rs/prism-kicad-materialization-pack",
    "src/rs/prism-kicad-transport",
    "src/rs/prism-kicad-svg",
    "src/rs/prism-kicad-wasm",
    "src/rs/prism-bundle",
    "src/rs/prism-kicad-cli",
    "src/rs/prism-projections",
    "src/rs/prism-vendors",
    "src/rs/prism-artwork",
    "src/rs/prism-docs-lab",
]
# Vendored third-party code (ADR amendment C3 §2 item 4): built as a path
# dependency, kept out of the workspace's own lints and tests.
exclude = ["third_party/geometer-client"]
resolver = "3"

[workspace.package]
version = "2026.9.7"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Wavenumber LLC"]
repository = "https://github.com/wavenumber-eng/kicad_monkey"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes_without_reason = "deny"
cognitive_complexity = "deny"
too_many_arguments = "deny"
too_many_lines = "deny"

[workspace.dependencies]
# Pre-declared for WP-B and the Wave 2 producers (cached, so they resolve offline).
crc32fast = "1.5.0"
libm = "0.2.16"
miniz_oxide = "=0.8.9"
anyhow = "1.0.102"
cap-std = "4.0.2"
libc = "=0.2.189"
windows-sys = { version = "=0.61.2", default-features = false }
regex = { version = "=1.12.4", default-features = false, features = ["std", "unicode-perl", "perf"] }
sha1_smol = "=1.0.1"
unicode-normalization = "=0.1.24"
geometer-client = { path = "third_party/geometer-client" }
geo = { version = "0.33.1", default-features = false }
harfrust = "0.13.0"
prettyplease = "0.2.37"
read-fonts = "0.43.0"
schemars = "0.8.22"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision", "preserve_order", "raw_value", "unbounded_depth"] }
sha2 = { version = "0.11.0", default-features = false }
skrifa = { version = "0.46.0", default-features = false, features = ["std"] }
syn = { version = "2.0.117", features = ["full"] }
tokio = { version = "1.47", features = ["rt-multi-thread"] }
typify = { version = "0.7.0", default-features = false }
ttf-parser = { version = "0.25.1", default-features = false, features = ["std", "variable-fonts"] }
unicode-casefold = "0.2.0"
zstd = "0.13.3"
wasm-bindgen = "0.2.126"
wasm-bindgen-test = "0.3.76"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
